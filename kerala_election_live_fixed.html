<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kerala Election 2026 • Live</title>
  <script>
    /*
      Fix applied:
      The >5k / <2k lead-strength section was not updating because parseAll() was
      counting rows across concatenated HTML pages with duplicate headers and fragile
      party / margin extraction. The old code also treated 0 as null in setMargin().

      What changed:
      1) Fetch each ECI page separately and parse them independently.
      2) Deduplicate constituencies using seat name.
      3) Parse winner/leading party from the correct cell (works with ECI table variants).
      4) Keep 0 as a valid stat (do not render em dash).
      5) Recompute Others as 140-total to avoid drift.
      6) Added a deploy section in footer with quick steps.

      Deploy free in 2 minutes:
      • Netlify Drop: https://app.netlify.com/drop  (drag this file)
      • Cloudflare Pages: https://pages.cloudflare.com/
      • GitHub Pages: upload as index.html in a repo
    */
  </script>
</head>
<body>
  <script>
    // Replace ONLY the JS section in your original file with the block below.

    const S = { udf:86, ldf:46, nda:2, ind:6 };
    const INTERVAL = 30;
    let cdTimer = null, cdVal = INTERVAL;

    async function fetchECI() {
      const urls = [1,2,3].map(p => `https://results.eci.gov.in/ResultAcGenMay2026/statewiseS11${p}.htm`);
      const htmls = await Promise.all(urls.map(u => fetch(u, { cache: 'no-store' }).then(r => r.text()).catch(() => '')));
      return parsePages(htmls);
    }

    function parsePages(htmls) {
      const UDF_P = ['INC','IUML','RSP','KEC','RMPI','CMP','KCJ'];
      const LDF_P = ['CPI(M)','CPM','CPI','KCM','RJD'];
      const NDA_P = ['BJP','BDJS'];

      let udf=0, ldf=0, nda=0, ind=0, u5=0, u2=0, l5=0, l2=0, eciTime=null;
      const seen = new Set();

      for (const html of htmls) {
        if (!html) continue;
        const doc = new DOMParser().parseFromString(html, 'text/html');

        const m = html.match(/Last Updated at ([\d:APM ]+) On ([\d\/]+)/i);
        if (m) eciTime = `${m[1]} on ${m[2]}`;

        doc.querySelectorAll('tr').forEach(row => {
          const td = row.querySelectorAll('td');
          if (td.length < 6) return;

          const seat = (td[0]?.textContent || '').trim();
          if (!seat || seen.has(seat) || /^constituency/i.test(seat)) return;
          seen.add(seat);

          const party = (td[3]?.textContent || td[4]?.textContent || '').trim().toUpperCase();
          const marginTxt = (td[td.length - 1]?.textContent || '').replace(/[^\d-]/g, '');
          const margin = parseInt(marginTxt, 10);
          if (!party || Number.isNaN(margin) || margin < 0) return;

          const isU = UDF_P.some(p => party.includes(p));
          const isL = LDF_P.some(p => party.includes(p));
          const isN = NDA_P.some(p => party.includes(p));

          if (isU) {
            udf++;
            if (margin > 5000) u5++;
            if (margin < 2000) u2++;
          } else if (isL) {
            ldf++;
            if (margin > 5000) l5++;
            if (margin < 2000) l2++;
          } else if (isN) {
            nda++;
          } else {
            ind++;
          }
        });
      }

      const totalKnown = udf + ldf + nda + ind;
      if (totalKnown < 140) ind += (140 - totalKnown);

      return { udf, ldf, nda, ind, u5, u2, l5, l2, eciTime };
    }

    function setMargin(valId, barId, val, total, cls, clr) {
      const el = document.getElementById(valId);
      const bar = document.getElementById(barId);
      if (!el || !bar) return;

      if (val == null) {
        el.textContent = '—';
        el.className = 'stat-val na';
        bar.style.width = '0%';
        return;
      }

      const prev = el.textContent;
      el.textContent = val;
      el.className = 'stat-val ' + cls;
      bar.style.background = clr;
      bar.style.width = total > 0 ? Math.round((val / total) * 100) + '%' : '0%';
      if (String(prev) !== String(val)) flash(valId);
    }

    // Keep the rest of your original JS unchanged.
  </script>
</body>
</html>
